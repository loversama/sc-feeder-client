name: Release Electron App

on:
  push:
    branches:
      - main # Trigger on push to main branch

permissions:
  contents: write # publish GitHub Releases with the built-in token (the old GH_TOKEN PAT expired)

jobs:
  # Packaged smoke test on all three OSes; nothing below runs (nothing is published) unless it passes.
  smoke:
    uses: ./.github/workflows/package-smoke.yml

  release:
    needs: smoke
    runs-on: ${{ matrix.os }} # Build on multiple OS

    strategy:
      fail-fast: false # one platform failing must not cancel the others
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    # Removed defaults block, steps will run at repository root
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22' # Electron 42+ requires Node >= 22.12
          cache: 'npm'
          cache-dependency-path: package-lock.json # Path relative to the default working-directory

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Vue/Vite Frontend
        run: npm run build # Creates dist/ + dist-electron/ and fails on non-native externals

      - name: Build and Publish Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required for publishing to GitHub Releases
        # Build artifacts for each OS in parallel.
        # Only publish (upload assets and create release) from the Linux job.
        run: >-
          npx electron-builder
          --${{ matrix.os == 'macos-latest' && 'mac' || matrix.os == 'windows-latest' && 'win' || 'linux' }}
          ${{ matrix.os == 'ubuntu-latest' && '--publish always' || '' }}